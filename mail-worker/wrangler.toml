name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "742dfb3e-59b3-484f-91ba-e2ea776d5c97"

[[kv_namespaces]]
binding = "kv"
id = "bc307a127beb4d3187b3af7830635dc8"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "cloudmail.thitlann.me"
zone_name = "thitlann.me"
custom_domain = true

[triggers]
crons = ["0 * * * *"]

[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
analysis_cache = false
orm_log = false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
